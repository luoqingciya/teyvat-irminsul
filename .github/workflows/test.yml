name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
      - name: 同步依赖
        run: uv sync --dev --extra dev
      - name: ruff 静态检查
        run: uv run ruff check .
      - name: pytest 冒烟测试
        run: uv run pytest -q