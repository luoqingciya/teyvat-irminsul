name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
      - name: 同步依赖
        run: uv sync --dev --extra dev

      # icon.ico 被 .gitignore 排除（*.ico），CI 上需重新生成
      - name: 生成应用图标
        run: uv run python scripts/_gen_icon.py

      - name: 打包后端 sidecar
        run: uv run python scripts/build_backend.py

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装前端依赖
        working-directory: electron
        run: npm ci

      - name: 构建并发布到 GitHub Releases
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always